'<div style="display:flex;gap:8px;margin-top:14px"><button class="btn" style="flex:1'+(fav?';background:var(--pink);color:#fff':'')+'" data-fav="'+id+'">'+(fav?'♥ Favori':'♡ Favori')+'</button><button class="btn" style="flex:1" data-excl="'+id+'">'+(ex?'Reproposer':'Ne plus proposer')+'</button></div></div></div>'}

function beep(){try{var a=new (window.AudioContext||window.webkitAudioContext)();[0,0.35,0.7].forEach(function(t){var o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.value=0.2;o.start(a.currentTime+t);o.stop(a.currentTime+t+0.2)})}catch(e){}try{navigator.vibrate&&navigator.vibrate([300,150,300,150,300])}catch(e){}}
function timerBar(){var el=document.getElementById("tbar");if(!TIMER){if(el)el.remove();return}if(!el){el=document.createElement("div");el.id="tbar";el.className="tbar";document.body.appendChild(el);el.addEventListener("click",function(ev){if(ev.target.closest("button")){clearInterval(TIMER.iv);TIMER=null;timerBar()}})}
var left=Math.max(0,Math.round((TIMER.end-Date.now())/1000));el.innerHTML='<span>⏱ '+Math.floor(left/60)+':'+String(left%60).padStart(2,"0")+'</span><button>Arrêter</button>';if(left<=0){clearInterval(TIMER.iv);TIMER=null;el.remove();beep();toast("⏱ C'est l'heure !")}}
function startTimer(min){if(TIMER)clearInterval(TIMER.iv);TIMER={end:Date.now()+min*60000};TIMER.iv=setInterval(timerBar,1000);timerBar();try{var a=new (window.AudioContext||window.webkitAudioContext)();a.resume()}catch(e){}}

root.addEventListener("click",function(ev){var t=ev.target;

if(ds.swap){GW=S.week;var p=ds.swap.split(".");var w=S.weeks[S.week];var cur=w.days[+p[0]][p[1]];var used=[cur];w.days.forEach(function(day){if(p[1]!=="m"){["d","s"].forEach(function(k){if(day[k])used.push(day[k])})}});w.days[+p[0]][p[1]]=pickFor(+p[0],p[1],used);save();rerender();return}
if(ds.swapsn!==undefined){var w2=S.weeks[S.week];w2.snacks[+ds.swapsn]=pick(pool("snack"),w2.snacks);save();rerender();return}
if(ds.grid){var g=ds.grid.split(".");S.grid[+g[0]][g[1]]=!S.grid[+g[0]][g[1]];normalize();save();rerender();return}
if(ds.unavoid){S.avoid=(S.avoid||[]).filter(function(x){return x!==ds.unavoid});S.weeks=[];normalize();save();rerender();toast("Plannings refaits ✓");return}
if(ds.fav){var i=S.fav.indexOf(ds.fav);if(i>=0)S.fav.splice(i,1);else S.fav.push(ds.fav);save();rerender();return}
if(ds.excl){var j=S.excl.indexOf(ds.excl);if(j>=0)S.excl.splice(j,1);else{S.excl.push(ds.excl);toast("Elle ne sera plus proposée")}save();rerender();return}
var act=ds.act;
if(act==="close"){sheet=null;settings=false;render();return}
if(act==="settings"){settings=true;resetArm=false;render();return}

if(act==="grid"){showGrid=!showGrid;rerender();return}
if(act==="prices"){showPrices=!showPrices;rerender();return}
if(act==="uncheck"){S.checked[S.scope==="month"?"month":"w"+S.week]={};save();rerender();return}

if(act==="sync"){var ba=budgetApp();if(ba){ba.item.amount=Math.round(monthCost()*1.15);ba.state.updatedAt=Date.now();try{localStorage.setItem(BKEY,JSON.stringify(ba.state))}catch(e){}toast("Budget mis à jour ✓")}return}
if(act==="export"){var blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="cuisine-sauvegarde-"+today()+".json";document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);return}
