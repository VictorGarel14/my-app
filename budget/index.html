function chartProj(P,A,Y){var W=320,H=150,pl=8,pr=8,pt=14,pb=22,n=Math.max(1,Math.round(Y));var maxV=Math.max(fv(P,A,n),1);
function x(i){return pl+(W-pl-pr)*i/n}function y(v){return pt+(H-pt-pb)*(1-v/maxV)}
var pv="",pd="";for(var i=0;i<=n;i++){pv+=(i?"L":"M")+x(i).toFixed(1)+","+y(fv(P,A,i)).toFixed(1);pd+=(i?"L":"M")+x(i).toFixed(1)+","+y(P*12*i).toFixed(1)}
var area=pv+"L"+x(n)+","+y(0)+"L"+x(0)+","+y(0)+"Z";var mid=Math.round(n/2);
return '<svg viewBox="0 0 '+W+' '+H+'" class="chart" role="img" aria-label="Projection de l\'investissement"><defs><linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#3448e6"/><stop offset=".5" stop-color="#8b2fd9"/><stop offset="1" stop-color="#ff2a93"/></linearGradient><linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff2a93" stop-opacity=".28"/><stop offset="1" stop-color="#ff2a93" stop-opacity="0"/></linearGradient></defs>'+
'<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="#24124a" stroke-width="2"/>'+
'<path d="'+area+'" fill="url(#g2)"/><path d="'+pd+'" fill="none" stroke="#24124a" stroke-width="2" stroke-dasharray="4 4"/><path d="'+pv+'" fill="none" stroke="url(#g1)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>'+
'<circle cx="'+x(n)+'" cy="'+y(fv(P,A,n))+'" r="5" fill="#ff2a93" stroke="#24124a" stroke-width="2"/>'+
'<text x="'+x(0)+'" y="'+(H-6)+'" font-size="11" font-weight="700" fill="#6d5a8f">0</text><text x="'+x(mid)+'" y="'+(H-6)+'" font-size="11" font-weight="700" fill="#6d5a8f" text-anchor="middle">'+mid+' ans</text><text x="'+x(n)+'" y="'+(H-6)+'" font-size="11" font-weight="700" fill="#6d5a8f" text-anchor="end">'+n+' ans</text></svg>'}
function chartHist(ms){var W=320,H=120,pb=20,pt=8;var mx=Math.max.apply(null,ms.map(function(m){return num(m.invested)}).concat([1]));var bw=Math.min((W-8)/ms.length,48);
return '<svg viewBox="0 0 '+W+' '+H+'" class="chart" role="img" aria-label="Investi par mois">'+ms.map(function(m,i){var v=num(m.invested),h=(H-pb-pt)*v/mx,x=(W-bw*ms.length)/2+i*bw+bw*.15,w=bw*.7;var lab=new Date(+m.m.slice(0,4),+m.m.slice(5)-1,1).toLocaleDateString("fr-FR",{month:"short"}).replace(".","");return '<rect x="'+x.toFixed(1)+'" y="'+(H-pb-h).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+Math.max(h,1).toFixed(1)+'" rx="5" fill="'+(m.spent<=m.budget?'#8b2fd9':'#ff2a93')+'" stroke="#24124a" stroke-width="1.5"/><text x="'+(x+w/2).toFixed(1)+'" y="'+(H-5)+'" font-size="10" font-weight="700" fill="#6d5a8f" text-anchor="middle">'+lab+'</text>'}).join("")+'</svg>'}
function viewInvest(){var t=totals();var ms=S.months.slice().sort(function(a,b){return a.m<b.m?-1:1});var tot=ms.reduce(function(s,m){return s+num(m.invested)},0);
var P=invTarget(),A=num(S.invest.rate),Y=Math.max(1,Math.min(40,num(S.invest.years)||10));var F=fv(P,A,Y),V=P*12*Y;
var h='<div class="card hero"><div class="lab">Investi au total</div><div class="big">'+eur(tot)+'</div><div class="sub">'+(ms.length?ms.length+' mois clôturé'+(ms.length>1?'s':'')+' · moyenne '+eur(tot/ms.length)+'/mois':'Clôture tes mois dans Journal pour suivre tes versements')+'</div></div>';
h+='<h2>Ma stratégie</h2><div class="card"><div class="row"><span><b>Versement mensuel</b><div class="small mute">Vide = ce qu\'il te reste ('+eur(Math.max(t.rest,0))+')</div></span><span style="width:110px"><input type="number" inputmode="decimal" id="inv-target" value="'+esc(S.invest.target)+'" placeholder="'+Math.round(Math.max(t.rest,0))+'"></span></div>'+
'<div class="row"><span><b>Rendement annuel</b><div class="small mute">Hypothèse moyenne, en %</div></span><span style="width:110px"><input type="number" inputmode="decimal" step="0.1" id="inv-rate" value="'+esc(S.invest.rate)+'"></span></div>'+

h+='<h2>Projection</h2><div class="card"><div style="display:flex;justify-content:space-between;align-items:flex-end;gap:8px"><div><div class="small mute" style="font-weight:700">Dans '+Y+' ans</div><div class="disp" style="font-size:32px;color:var(--violet);line-height:1.1">≈ '+eur(F)+'</div></div><div style="text-align:right" class="small"><div><b>'+eur(V)+'</b> versés</div><div style="color:var(--pink)"><b>+'+eur(F-V)+'</b> de gains</div></div></div>'+chartProj(P,A,Y)+
'<div class="legend"><span><i style="background:var(--grad)"></i>Avec rendement</span><span><i class="dash"></i>Versé seulement</span></div></div>';
h+='<div class="card"><div class="small mute" style="font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">Et si…</div>'+[50,100,200].map(function(d){var f2=fv(P+d,A,Y);return '<div class="row"><span>+'+d+' €/mois</span><span class="v">'+eur(f2)+' <span class="small" style="color:var(--pink)">(+'+eur(f2-F)+')</span></span></div>'}).join("")+'</div>';
h+='<h2>Historique<span class="n">'+ms.length+'</span></h2><div class="card">'+(ms.length?chartHist(ms.slice(-12))+ms.slice().reverse().map(function(m){return '<div class="entry"><div><div class="ttl" style="text-transform:capitalize">'+monthLabel(m.m)+'</div><div class="d">'+(m.spent<=m.budget?'Boucle validée ✓':'Budget dépassé')+' · dépensé '+eur(m.spent)+'</div></div><span class="v">'+eur(num(m.invested))+'</span></div>'}).join(""):'<div class="empty">Aucun mois clôturé pour l\'instant.</div>')+'</div>';
h+='<div class="note">Projection indicative avec un rendement constant et des versements réguliers. Les marchés varient, et ce n\'est pas un conseil en investissement.</div>';
return h}
